# Publie le dossier public/ sur GitHub Pages (mode statique : données locales au navigateur).
name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ⚠️ Pages doit être activé À LA MAIN une fois, sinon cette étape échoue
      # avec « Get Pages site failed » :
      #   Settings → Pages → Build and deployment → Source : GitHub Actions
      # L'option `enablement: true` ne suffit pas : le jeton des Actions n'a pas
      # le droit de créer un site Pages (« Resource not accessible by integration »).
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
